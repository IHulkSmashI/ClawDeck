name: build
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read    # pull requests run untrusted code: read only; the plugin job alone may write (sideload)
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true   # an older main run must never force-push its build over a newer one
jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with: { python-version: '3.11' }   # Decky ships its own Python; keep the code 3.11-compatible
      - run: pip install pytest && python -m pytest -q tests
  plugin:
    runs-on: ubuntu-latest
    needs: backend-tests
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        with: { version: 9 }
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit
      - run: pnpm build
      - name: package (Decky zip layout)
        run: |
          # only what runs on the Claw: dev tools, the preview and the image sources stay in the repository
          mkdir -p out/ClawDeck/tools out/ClawDeck/assets
          cp -r dist plugin.json package.json main.py py_modules LICENSE README.md out/ClawDeck/
          cp tools/clawdeck-launch.sh tools/selftest.py tools/sysfs-survey.sh out/ClawDeck/tools/
          cp assets/versions.json out/ClawDeck/assets/
          rm -rf out/ClawDeck/py_modules/clawdeck/__pycache__
          (cd out && zip -qr ../ClawDeck.zip ClawDeck)
      - uses: actions/upload-artifact@v7
        with: { name: ClawDeck, path: ClawDeck.zip }
  release:
    # write access only for version tags (the maintainer creates those after testing on a Claw)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: plugin
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: { name: ClawDeck }
      - uses: softprops/action-gh-release@v3
        with: { files: ClawDeck.zip }
  sideload:
    # the only job with write access, and only for pushes to main: no pull-request code ever runs with it
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: plugin
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: ClawDeck }
      - name: publish the main build on the sideload branch (for testing on a Claw before a release)
        run: |
          set -e
          sha=$(git rev-parse --short HEAD)
          git config user.name IHulkSmashI
          git config user.email 227083792+IHulkSmashI@users.noreply.github.com
          git checkout --orphan sideload-new
          git rm -rfq --cached . && rm -rf out dist node_modules
          git add -f ClawDeck.zip
          echo "ClawDeck.zip built from main @ $sha, $(date -u +%FT%TZ)" > BUILD.txt
          git add BUILD.txt
          git commit -qm "sideload: main @ $sha"
          git push -f origin sideload-new:sideload
