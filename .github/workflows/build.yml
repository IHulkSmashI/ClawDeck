name: build
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }   # Decky ships its own Python; keep the code 3.11-compatible
      - run: pip install pytest && python -m pytest -q tests
  plugin:
    runs-on: ubuntu-latest
    needs: backend-tests
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit
      - run: pnpm build
      - name: package (Decky zip layout)
        run: |
          mkdir -p out/ClawDeck
          cp -r dist plugin.json package.json main.py py_modules tools assets LICENSE README.md out/ClawDeck/
          rm -rf out/ClawDeck/py_modules/clawdeck/__pycache__
          (cd out && zip -qr ../ClawDeck.zip ClawDeck)
      - uses: actions/upload-artifact@v4
        with: { name: ClawDeck, path: ClawDeck.zip }
      - name: release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with: { files: ClawDeck.zip }
