<!doctype html>
<!-- Source of assets/banner.png (Decky store image). Render: node tools/render-banner.mjs -->
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=Mulish:wght@600;700&display=swap">
<style>
  :root { --ground: #0b0f14; --panel: #171d25; --line: #2c3440; --ink: #e4e8ec; --dim: #9aa4b1; --accent: #3fa7ff; }
  html, body { margin: 0; }
  body { width: 1280px; height: 640px; overflow: hidden; background: var(--ground); color: var(--ink); font-family: "Mulish", sans-serif; position: relative; }
  .glow { position: absolute; inset: 0; background: radial-gradient(700px 420px at 78% 40%, #16324f 0%, transparent 70%), radial-gradient(500px 300px at 10% 110%, #122030 0%, transparent 70%); }
  /* three claw marks: the one graphic idea, kept to the right */
  .marks { position: absolute; right: 10px; top: 70px; width: 360px; height: 500px; }
  .mark { position: absolute; width: 28px; height: 520px; border-radius: 14px; background: linear-gradient(180deg, transparent 0%, var(--accent) 22%, #9fd3ff 50%, var(--accent) 78%, transparent 100%); transform: rotate(18deg); opacity: .9; box-shadow: 0 0 60px #3fa7ff55; }
  .mark:nth-child(1) { left: 90px; top: -10px; }
  .mark:nth-child(2) { left: 185px; top: 20px; }
  .mark:nth-child(3) { left: 280px; top: -10px; }
  .copy { position: absolute; left: 96px; top: 150px; display: grid; gap: 22px; }
  .eyebrow { font: 700 22px/1 "Mulish", sans-serif; letter-spacing: .16em; text-transform: uppercase; color: var(--accent); }
  h1 { margin: 0; font: 700 150px/0.9 "Chakra Petch", sans-serif; letter-spacing: .005em; }
  .tags { display: flex; gap: 12px; flex-wrap: wrap; max-width: 820px; }
  .tags span { font: 600 22px/1 "Mulish", sans-serif; color: var(--ink); padding: 12px 16px; border: 1px solid var(--line); border-radius: 6px; background: #171d25cc; }
</style></head>
<body>
  <div class="glow"></div>
  <div class="marks"><div class="mark"></div><div class="mark"></div><div class="mark"></div></div>
  <div class="copy">
    <div class="eyebrow">For the MSI Claw on Linux</div>
    <h1>ClawDeck</h1>
    <div class="tags"><span>Power profiles</span><span>Autotune</span><span>XeSS on XMX</span><span>Battery care</span></div>
  </div>
</body></html>
